<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RE:TONE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hahmlet&family=Nanum+Myeongjo&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;600;700&family=Song+Myung&display=swap"
      rel="stylesheet"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="storage.css" />
    <link rel="stylesheet" href="common.css" />
  </head>

  <body>
    <!-- 🔥 네비게이션 -->
    <div class="navbar">
      <a href="opening.html" class="logo">
        <img src="images/logo.png" alt="RE:TONE" />
      </a>

      <ul class="menu">
        <li>
          <a href="index.html">언어 포장</a>
        </li>

        <li class="active">
          <a href="storage.html">언어 창고</a>
        </li>

        <li>
          <a href="test.html">포장 유형 테스트</a>
        </li>

        <li>
          <a href="lab.html">가상 대화 실험</a>
        </li>
      </ul>
    </div>

    <!-- 🔥 컨베이어 -->
    <div class="belt-wrapper">
      <!-- 레일 -->
      <div class="rail"></div>
      <div class="rail second"></div>
      <div class="rail third"></div>

      <!-- 벨트 -->
      <div class="belt" id="belt1"></div>
      <div class="belt" id="belt2"></div>
      <div class="belt" id="belt3"></div>
    </div>

    <div class="modal" id="modal">
      <div class="close-btn" onclick="closeModal()">✕</div>

      <div class="card-flip" onclick="flipCard()">
        <div class="card-inner" id="cardInner">
          <div class="card-front">
            <p id="modalText"></p>
            <div id="packDate" class="pack-date"></div>
          </div>

          <div class="card-back">
            <p id="originalText"></p>
            <div class="basic-card-message">
              같은 말도, 어떻게 포장하느냐에 따라 다르게 전해집니다.
            </div>
          </div>
        </div>

        <span class="flip-guide"> 카드를 눌러 원래 문장을 확인해 보세요! </span>
      </div>
    </div>

    <!-- JS -->
    <script src="storage.js"></script>

    <script>
      function goPage(page) {
        window.location.href = page;
      }
    </script>
  </body>
</html>
